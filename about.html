</style></head><body><div class="app"><div class="top"><a class="back" href="index.html">←</a><h1>About District 325F</h1></div><div class="hero"><img id="lionsLogo" class="logo" alt="Lions Logo"><h2>Lions International</h2><p>District 325 F, Nepal</p><div class="slogan">Service • Leadership • Community • Together</div></div><div class="info"><h2>About District 325F</h2><p id="districtInformation"></p></div><h2 class="offTitle">District Officers</h2><div class="ly" id="lyText"></div><div class="officers" id="officers"><div class="empty">Officer data loading...</div></div></div><div class="bottom"><a class="nav" href="index.html"><span>🏠</span>Home</a><a class="nav" href="index.html#systemGrid"><span>📱</span>Systems</a><a class="nav active" href="about.html"><span>ℹ️</span>About</a><a class="nav" href="admin.html"><span>⚙️</span>Admin</a></div><script>
const API_URL="https://script.google.com/macros/s/AKfycbz1hmQLbm4wa5qheEu2ErIt-ni0r24IenrMHZGaYZu8YtMCmtDHMR0-s6NuFZEifRl8QQ/exec";function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}fetch(API_URL+"?action=about").then(r=>r.json()).then(data=>{if(data.settings){const l=document.getElementById("lionsLogo");if(data.settings.LogoURL){l.src=data.settings.LogoURL;l.style.display="block"}document.getElementById("districtInformation").innerText=data.settings.AboutText||""}const list=data.officers||[],box=document.getElementById("officers");box.innerHTML="";if(data.currentLY)lyText.innerText="LY "+data.currentLY;if(!list.length){box.innerHTML='<div class="empty">Active District Officer data उपलब्ध छैन।</div>';return}list.forEach((o,i)=>{const d=document.createElement("div");d.className="officer"+(i===0?" primary":"");d.innerHTML=`<div class="officerHead">${esc(o.Position||"District Officer")}</div><div class="officerBody"><img src="${esc(o.PhotoURL||"")}" onerror="this.style.visibility='hidden'"><div class="details"><h3>${esc(o.Name||"")}</h3><p><b>Membership No:</b> ${esc(o.MembershipNumber||"")}</p>${o.Mobile?`<p>📞 ${esc(o.Mobile)}</p>`:""}${o.Email?`<p>✉️ ${esc(o.Email)}</p>`:""}${o.Address?`<p>📍 ${esc(o.Address)}</p>`:""}${o.Profession?`<p>💼 ${esc(o.Profession)}</p>`:""}${o.BloodGroup?`<p>🩸 ${esc(o.BloodGroup)}</p>`:""}</div></div>`;box.appendChild(d)})}).catch(()=>officers.innerHTML='<div class="empty">Officer data load हुन सकेन।</div>');
