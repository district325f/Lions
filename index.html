<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>District 325F Digital Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,'Noto Sans Devanagari',sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:linear-gradient(180deg,#edf9fc,#f8fbff);
  color:#10233f;
  padding-bottom:95px;
}

.app{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.menu{
  font-size:30px;
  color:#123;
}

.badge{
  background:#0d47a1;
  color:white;
  padding:8px 15px;
  border-radius:22px;
  font-weight:bold;
  box-shadow:0 5px 15px #0001;
}

.hero{
  background:linear-gradient(135deg,#0d47a1,#1976d2);
  color:white;
  border-radius:30px;
  padding:32px 22px;
  box-shadow:0 15px 35px #0002;
  margin-bottom:22px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  gap:25px;
}

.hero::after{
  content:'';
  position:absolute;
  width:220px;
  height:220px;
  background:#ffffff12;
  border-radius:50%;
  right:-60px;
  top:-60px;
}

.logoBox{
  min-width:120px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  z-index:2;
}

.lionsLogo{
  width:110px;
  height:110px;
  object-fit:contain;
  background:white;
  padding:8px;
  border-radius:50%;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
  display:none;
}

.heroContent{
  flex:1;
  text-align:center;
  position:relative;
  z-index:2;
}

.hero h1{
  font-size:48px;
  margin-bottom:12px;
  font-weight:800;
  letter-spacing:.5px;
  text-shadow:0 4px 15px rgba(0,0,0,0.18);
}

.hero p{
  font-size:24px;
  opacity:.98;
  font-weight:500;
  letter-spacing:.3px;
  text-shadow:0 3px 10px rgba(0,0,0,0.15);
}

.dateBox{
  margin-top:20px;
  background:#ffffff24;
  border-radius:18px;
  padding:12px 18px;
  display:inline-block;
  font-size:18px;
  font-weight:600;
  backdrop-filter:blur(10px);
}

.search{
  background:white;
  border-radius:22px;
  padding:15px 18px;
  box-shadow:0 8px 25px #0001;
  margin-bottom:22px;
  display:flex;
  gap:10px;
  align-items:center;
}

.search input{
  border:none;
  outline:none;
  width:100%;
  font-size:16px;
  background:transparent;
}

.sectionTitle{
  font-size:24px;
  margin:18px 4px;
  font-weight:800;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.card{
  background:white;
  border-radius:24px;
  padding:20px 14px;
  text-align:center;
  box-shadow:0 10px 28px #00000012;
  text-decoration:none;
  color:#10233f;
  transition:.28s;
  border:1px solid #eef2f7;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:'';
  position:absolute;
  width:120px;
  height:120px;
  background:#1976d208;
  border-radius:50%;
  right:-40px;
  top:-40px;
}

.card:hover{
  transform:translateY(-7px) scale(1.02);
  box-shadow:0 18px 40px #0002;
}

.icon{
  font-size:42px;
  margin-bottom:12px;
  position:relative;
  z-index:2;
}

.card h3{
  font-size:18px;
  margin-bottom:8px;
  position:relative;
  z-index:2;
}

.card p{
  font-size:13px;
  color:#667085;
  line-height:1.5;
  min-height:38px;
  position:relative;
  z-index:2;
}

.open{
  margin-top:14px;
  background:#f4b400;
  color:#10233f;
  border-radius:18px;
  padding:8px 14px;
  font-size:13px;
  font-weight:bold;
  display:inline-block;
  position:relative;
  z-index:2;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:25px;
  background:white;
  border-radius:20px;
  color:#667085;
}

.skeleton{
  height:170px;
  border-radius:24px;
  background:linear-gradient(90deg,#eef2f7,#ffffff,#eef2f7);
  background-size:200% 100%;
  animation:shine 1s infinite;
}

@keyframes shine{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

.footer{
  text-align:center;
  margin:35px 0 5px;
  font-size:15px;
  color:#475467;
  line-height:1.8;
}

.footer strong{
  color:#0d47a1;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  box-shadow:0 -8px 25px #0002;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  z-index:999;
  backdrop-filter:blur(10px);
}

.nav{
  font-size:12px;
  text-align:center;
  color:#42526e;
  text-decoration:none;
  transition:.2s;
}

.nav:hover{
  transform:translateY(-2px);
}

.nav span{
  display:block;
  font-size:24px;
  margin-bottom:2px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(max-width:700px){
  .hero{
    flex-direction:column;
    text-align:center;
  }

  .hero h1{
    font-size:36px;
  }

  .hero p{
    font-size:20px;
  }

  .logoBox{
    min-width:auto;
  }

  .lionsLogo{
    width:95px;
    height:95px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="menu">☰</div>
    <div class="badge">District 325F</div>
  </div>

  <div class="hero">

    <div class="logoBox">
      <img
        id="lionsLogo"
        class="lionsLogo"
        src=""
        alt="Lions Logo">
    </div>

    <div class="heroContent">
      <h1 id="mainTitle">District 325F Digital Hub</h1>
      <p id="subTitle">One Click • One District • One Digital Future</p>
      <div class="dateBox" id="today">Loading Date...</div>
    </div>

  </div>

  <div class="search">
    🔍
    <input
      type="text"
      id="searchInput"
      placeholder="System खोज्नुहोस्...">
  </div>

  <h2 class="sectionTitle">Digital Systems</h2>

  <div class="grid" id="systemGrid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <div class="footer">
    Design by: <strong>Nirajan Aryal</strong>
    <br>
    Mobile: 9851113811
  </div>

</div>

<div class="bottom">
  <a class="nav" href="#">
    <span>🏠</span>
    Home
  </a>

  <a class="nav" href="#systemGrid">
    <span>📱</span>
    Systems
  </a>

  <a class="nav" href="#">
    <span>ℹ️</span>
    About
  </a>

  <a class="nav" href="#">
    <span>⚙️</span>
    Admin
  </a>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbz1hmQLbm4wa5qheEu2ErIt-ni0r24IenrMHZGaYZu8YtMCmtDHMR0-s6NuFZEifRl8QQ/exec";

const systemGrid = document.getElementById("systemGrid");
const searchInput = document.getElementById("searchInput");

let allSystems = [];

const today = new Date();

document.getElementById("today").innerHTML =
  "आज: " +
  today.toLocaleDateString("ne-NP") +
  " • " +
  today.toLocaleTimeString("ne-NP",{
    hour:'2-digit',
    minute:'2-digit'
  });


// CACHE LOAD

const cached = localStorage.getItem("hubData");

if(cached){
  const saved = JSON.parse(cached);
  applySettings(saved.settings);
  allSystems = saved.systems || [];
  renderSystems(allSystems);
}


// LIVE FETCH

fetch(API_URL)
.then(res => res.json())
.then(data => {
  localStorage.setItem("hubData", JSON.stringify(data));
  applySettings(data.settings);
  allSystems = data.systems || [];
  renderSystems(allSystems);
})
.catch(error => {
  if(!cached){
    systemGrid.innerHTML = `
      <div class="loading">
        System load हुन सकेन।
        <br><br>
        Apps Script Deployment check गर्नुहोस्।
      </div>
    `;
  }
});


// SETTINGS

function applySettings(settings){
  if(!settings) return;

  document.getElementById("mainTitle").innerText =
    settings.MainTitle ||
    "District 325F Digital Hub";

  document.getElementById("subTitle").innerText =
    settings.SubTitle ||
    "One Click • One District • One Digital Future";

  const logo = document.getElementById("lionsLogo");

  if(settings.LogoURL){
    logo.src = settings.LogoURL;
    logo.style.display = "block";
  }else{
    logo.style.display = "none";
  }
}


// SYSTEM RENDER

function renderSystems(systems){
  systemGrid.innerHTML = "";

  if(!systems.length){
    systemGrid.innerHTML = `
      <div class="loading">
        Active system भेटिएन।
      </div>
    `;
    return;
  }

  systems.forEach(item => {
    const card = document.createElement("a");

    card.className = "card";
    card.href = item.Link || "#";
    card.target = "_blank";

    card.innerHTML = `
      <div class="icon">
        ${item.Icon || "🔗"}
      </div>

      <h3>
        ${item.Name || "Untitled System"}
      </h3>

      <p>
        ${item.Description || ""}
      </p>

      <div class="open">
        Open System
      </div>
    `;

    systemGrid.appendChild(card);
  });
}


// SEARCH

searchInput.addEventListener("input", function(){
  const value = this.value.toLowerCase();

  const filtered =
  allSystems.filter(item =>
    String(item.Name).toLowerCase().includes(value)
    ||
    String(item.Description).toLowerCase().includes(value)
  );

  renderSystems(filtered);
});
</script>

</body>
</html>
