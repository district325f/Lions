<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>District 325F Digital Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,'Noto Sans Devanagari',sans-serif;
}
body{
  background:linear-gradient(180deg,#edf9fc,#f8fbff);
  color:#10233f;
  padding-bottom:95px;
}
.app{
  max-width:1100px;
  margin:auto;
  padding:18px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.menu{
  font-size:30px;
  color:#123;
}
.badge{
  background:#0d47a1;
  color:white;
  padding:8px 15px;
  border-radius:22px;
  font-weight:bold;
}
.hero{
  background:linear-gradient(135deg,#0d47a1,#1976d2);
  color:white;
  border-radius:30px;
  padding:28px 22px;
  box-shadow:0 15px 35px #0002;
  margin-bottom:22px;
}
.hero h1{
  font-size:30px;
  margin-bottom:8px;
}
.hero p{
  font-size:16px;
  opacity:.95;
}
.dateBox{
  margin-top:18px;
  background:#ffffff24;
  border-radius:18px;
  padding:12px 15px;
  display:inline-block;
}
.search{
  background:white;
  border-radius:22px;
  padding:15px 18px;
  box-shadow:0 8px 25px #0001;
  margin-bottom:22px;
  display:flex;
  gap:10px;
  align-items:center;
}
.search input{
  border:none;
  outline:none;
  width:100%;
  font-size:16px;
}
.sectionTitle{
  font-size:22px;
  margin:18px 4px;
  font-weight:800;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}
.card{
  background:white;
  border-radius:24px;
  padding:18px 12px;
  text-align:center;
  box-shadow:0 10px 28px #00000012;
  text-decoration:none;
  color:#10233f;
  transition:.25s;
  border:1px solid #eef2f7;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 16px 35px #0002;
}
.icon{
  font-size:36px;
  margin-bottom:10px;
}
.card h3{
  font-size:16px;
  margin-bottom:7px;
}
.card p{
  font-size:12px;
  color:#667085;
  line-height:1.4;
  min-height:35px;
}
.open{
  margin-top:12px;
  background:#f4b400;
  color:#10233f;
  border-radius:18px;
  padding:7px 12px;
  font-size:12px;
  font-weight:bold;
  display:inline-block;
}
.loading{
  grid-column:1/-1;
  text-align:center;
  padding:25px;
  background:white;
  border-radius:20px;
  color:#667085;
}
.footer{
  text-align:center;
  margin:30px 0 5px;
  font-size:14px;
  color:#475467;
}
.footer strong{
  color:#0d47a1;
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  box-shadow:0 -8px 25px #0002;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  z-index:99;
}
.nav{
  font-size:12px;
  text-align:center;
  color:#42526e;
  text-decoration:none;
}
.nav span{
  display:block;
  font-size:24px;
  margin-bottom:2px;
}
@media(min-width:700px){
  .hero h1{font-size:42px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .card{padding:24px 15px}
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="menu">☰</div>
    <div class="badge">District 325F</div>
  </div>

  <div class="hero">
    <h1>District 325F Digital Hub</h1>
    <p>One Click • One District • One Digital Future</p>
    <div class="dateBox" id="today">आजको मिति</div>
  </div>

  <div class="search">
    🔍 <input type="text" id="searchInput" placeholder="System खोज्नुहोस्...">
  </div>

  <h2 class="sectionTitle">Digital Systems</h2>

  <div class="grid" id="systemGrid">
    <div class="loading">Systems loading...</div>
  </div>

  <div class="footer">
    Design by: <strong>Nirajan Aryal</strong> (9851113811)
  </div>

</div>

<div class="bottom">
  <a class="nav" href="#"><span>🏠</span>Home</a>
  <a class="nav" href="#systemGrid"><span>📱</span>Systems</a>
  <a class="nav" href="#"><span>ℹ️</span>About</a>
  <a class="nav" href="#"><span>⚙️</span>Admin</a>
</div>

<script>
const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

const systemGrid = document.getElementById("systemGrid");
const searchInput = document.getElementById("searchInput");
let allSystems = [];

const today = new Date();
document.getElementById("today").innerHTML =
  "आज: " + today.toLocaleDateString("ne-NP") + " • " +
  today.toLocaleTimeString("ne-NP",{hour:'2-digit',minute:'2-digit'});

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    allSystems = data;
    renderSystems(allSystems);
  })
  .catch(error => {
    systemGrid.innerHTML = `
      <div class="loading">
        System load हुन सकेन। Apps Script URL / Deployment check गर्नुहोस्।
      </div>
    `;
  });

function renderSystems(systems){
  systemGrid.innerHTML = "";

  if(!systems.length){
    systemGrid.innerHTML = `<div class="loading">Active system भेटिएन। Sheet मा Status = Active राख्नुहोस्।</div>`;
    return;
  }

  systems.forEach(item => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = item.Link || "#";
    card.target = "_blank";

    card.innerHTML = `
      <div class="icon">${item.Icon || "🔗"}</div>
      <h3>${item.Name || "Untitled System"}</h3>
      <p>${item.Description || ""}</p>
      <div class="open">Open System</div>
    `;

    systemGrid.appendChild(card);
  });
}

searchInput.addEventListener("input", function(){
  const value = this.value.toLowerCase();

  const filtered = allSystems.filter(item =>
    String(item.Name).toLowerCase().includes(value) ||
    String(item.Description).toLowerCase().includes(value)
  );

  renderSystems(filtered);
});
</script>

</body>
</html>
