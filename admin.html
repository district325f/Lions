<!DOCTYPE html><html lang="ne"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>District 325F Admin</title><style>*{box-sizing:border-box;font-family:Arial,'Noto Sans Devanagari',sans-serif}body{margin:0;background:#eef6fb;color:#10233f}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 10px 28px #0001}h1,h2{color:#0d47a1}.login{max-width:430px;margin:60px auto}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}input,select,button{width:100%;padding:12px;border:1px solid #d8e1eb;border-radius:12px;font-size:15px}button{border:0;background:#0d47a1;color:#fff;font-weight:bold;cursor:pointer}.gold{background:#f4b400;color:#10233f}.danger{background:#c62828}.muted{background:#667085}.toolbar{display:flex;gap:10px}.toolbar button{width:auto}.preview{display:flex;gap:16px;align-items:center;margin:15px 0;padding:15px;background:#f8fbff;border-radius:16px}.preview img{width:110px;height:130px;object-fit:cover;border-radius:14px;background:#e9eef5}.msg{padding:10px;border-radius:10px;margin-top:10px;background:#eef6ff}.listItem{border:1px solid #e6ebf0;border-radius:16px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.hidden{display:none}@media(max-width:650px){.row{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{flex-wrap:wrap}.preview{align-items:flex-start}}</style></head><body><div class="wrap"><div id="loginBox" class="card login"><h1>⚙️ Admin Login</h1><label>Username</label><input id="user"><br><br><label>Password</label><input id="pass" type="password"><br><br><button onclick="login()">Login</button><div id="loginMsg"></div></div><div id="panel" class="hidden"><div class="card"><div class="toolbar"><button class="muted" onclick="location.href='index.html'">← Home</button><button class="danger" onclick="logout()">Logout</button></div><h1>District Officers Management</h1><p>Membership Number बाट member खोजेर officer assign गर्नुहोस्।</p></div><div class="card"><h2>1. Search Member</h2><div class="toolbar"><input id="memberNo" placeholder="Membership Number"><button onclick="searchMember()">Search</button></div><div id="searchMsg"></div><div id="preview" class="preview hidden"><img id="photo"><div><h3 id="mName"></h3><div id="mDetails"></div></div></div><div class="toolbar"><input id="photoFile" type="file" accept="image/*"><button class="gold" onclick="uploadPhoto()">Upload / Change Photo</button><button class="danger" onclick="removePhoto()">Remove Photo</button></div></div><div class="card"><h2>2. Assign / Edit Officer</h2><div class="row"><div><label>Category</label><input id="category" placeholder="District Executive Officers"></div><div><label>Position</label><input id="position" placeholder="District Governor"></div><div><label>LY</label><input id="ly" placeholder="2026/27"></div><div><label>Display Order</label><input id="order" type="number" value="1"></div><div><label>Start Date</label><input id="start" type="date"></div><div><label>End Date</label><input id="end" type="date"></div><div><label>Status</label><select id="active"><option>Yes</option><option>No</option></select></div><div class="full"><button onclick="saveOfficer()">Assign / Save Officer</button></div></div><div id="saveMsg"></div></div><div class="card"><h2>Current / Saved Officers</h2><div id="officerList">Loading...</div></div></div></div><script>
const API="https://script.google.com/macros/s/AKfycbz1hmQLbm4wa5qheEu2ErIt-ni0r24IenrMHZGaYZu8YtMCmtDHMR0-s6NuFZEifRl8QQ/exec";let token=localStorage.getItem("hubAdminToken")||"",member=null,editingId="";if(token){showPanel();loadOfficers()}async function call(action,data={}){data.action=action;data.token=token;const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});return r.json()}async function login(){try{const d=await call("login",{username:user.value,password:pass.value});if(!d.ok)throw Error(d.message||"Login failed");token=d.token;localStorage.setItem("hubAdminToken",token);showPanel();loadOfficers()}catch(e){loginMsg.innerHTML='<div class="msg">'+e.message+'</div>'}}function showPanel(){loginBox.classList.add("hidden");panel.classList.remove("hidden")}function logout(){localStorage.removeItem("hubAdminToken");location.reload()}async function searchMember(){try{const d=await call("searchMember",{membershipNumber:memberNo.value.trim()});if(!d.ok)throw Error(d.message);member=d.member;mName.textContent=member.Name||"";mDetails.innerHTML=`ID: ${member.MembershipNumber||""}<br>${member.Mobile||""}<br>${member.Email||""}<br>${member.Address||""}`;photo.src=member.PhotoURL||"";preview.classList.remove("hidden");searchMsg.textContent=""}catch(e){searchMsg.innerHTML='<div class="msg">'+e.message+'</div>'}}async function saveOfficer(){if(!member)return alert("पहिले Membership Number Search गर्नुहोस्।");const d=await call("saveOfficer",{officerId:editingId,membershipNumber:member.MembershipNumber,category:category.value,position:position.value,ly:ly.value,startDate:start.value,endDate:end.value,displayOrder:order.value,active:active.value});saveMsg.innerHTML='<div class="msg">'+(d.message||"Saved")+'</div>';if(d.ok){editingId="";loadOfficers()}}async function loadOfficers(){const d=await call("adminListOfficers");if(!d.ok){officerList.textContent=d.message||"Unable to load";return}officerList.innerHTML="";d.officers.forEach(o=>{const x=document.createElement("div");x.className="listItem";x.innerHTML=`<div><b>${o.Position||""}</b><br>${o.Name||""} (${o.MembershipNumber||""})<br><small>LY ${o.LY||""} • ${o.Active||""}</small></div><div class="toolbar"><button class="editBtn">Edit</button><button class="danger inactiveBtn">Inactive</button></div>`;x.querySelector('.editBtn').onclick=()=>editOfficer(o);x.querySelector('.inactiveBtn').onclick=()=>deactivate(o.OfficerID);officerList.appendChild(x)})}function editOfficer(o){editingId=o.OfficerID;memberNo.value=o.MembershipNumber;category.value=o.Category||"";position.value=o.Position||"";ly.value=o.LY||"";start.value=o.StartDate||"";end.value=o.EndDate||"";order.value=o.DisplayOrder||1;active.value=o.Active||"Yes";searchMember();scrollTo({top:0,behavior:"smooth"})}async function deactivate(id){if(!confirm("Officer लाई Inactive गर्ने?"))return;await call("deactivateOfficer",{officerId:id});loadOfficers()}async function uploadPhoto(){if(!member)return alert("पहिले member search गर्नुहोस्।");const f=photoFile.files[0];if(!f)return alert("Photo select गर्नुहोस्।");if(f.size>2*1024*1024)return alert("Photo 2MB भन्दा सानो राख्नुहोस्।");const b64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.readAsDataURL(f)});const d=await call("uploadPhoto",{membershipNumber:member.MembershipNumber,fileName:f.name,mimeType:f.type,base64:b64});alert(d.message);if(d.ok)searchMember()}async function removePhoto(){if(!member||!confirm("यो officer photo remove गर्ने?"))return;const d=await call("removePhoto",{membershipNumber:member.MembershipNumber});alert(d.message);if(d.ok)searchMember()}
</script></body></html>
